name: Compilar Visualtech Slicer (Windows)

# Se ejecuta en cada cambio en main y también a mano desde la pestaña "Actions".
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/probar-windows.yml'
      - 'README.md'
      - 'branding/previews/**'
  workflow_dispatch:

concurrency:
  group: compilar-windows
  cancel-in-progress: true

env:
  # Versión de OrcaSlicer sobre la que se arma el programa. Para actualizar, cambiá este valor.
  ORCA_REPO: OrcaSlicer/OrcaSlicer
  ORCA_TAG: v2.4.2
  PYTHONUTF8: "1"

jobs:
  # Etapa 1: librerías de OrcaSlicer. Tarda 1-2 h la primera vez; después queda en caché.
  librerias:
    runs-on: windows-latest
    timeout-minutes: 350
    outputs:
      cache-key: ${{ steps.key.outputs.key }}
    steps:
      - name: Bajar OrcaSlicer ${{ env.ORCA_TAG }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ORCA_REPO }}
          ref: ${{ env.ORCA_TAG }}
          path: orca

      - name: Clave de caché
        id: key
        shell: bash
        run: echo "key=win-x64-deps-${{ env.ORCA_TAG }}-${{ hashFiles('orca/deps/**') }}" >> "$GITHUB_OUTPUT"

      - name: Buscar librerías en caché
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: orca/deps/build/OrcaSlicer_dep
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Instalar CMake
        if: steps.cache.outputs.cache-hit != 'true'
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.3.0"

      - name: Preparar Visual Studio
        if: steps.cache.outputs.cache-hit != 'true'
        uses: microsoft/setup-msbuild@v2

      - name: Compilar librerías
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: orca
        shell: pwsh
        run: .\build_release_vs.bat deps

      - name: Guardar librerías en caché
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: orca/deps/build/OrcaSlicer_dep
          key: ${{ steps.key.outputs.key }}

  # Etapa 2: el programa con la marca Visualtech y el instalador.
  programa:
    needs: librerias
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - name: Bajar este repositorio
        uses: actions/checkout@v4
        with:
          path: visualtech

      - name: Bajar OrcaSlicer ${{ env.ORCA_TAG }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ORCA_REPO }}
          ref: ${{ env.ORCA_TAG }}
          path: orca

      - name: Recuperar librerías
        uses: actions/cache/restore@v4
        with:
          path: orca/deps/build/OrcaSlicer_dep
          key: ${{ needs.librerias.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Aplicar marca Visualtech
        run: |
          python -m pip install --quiet pillow polib
          python visualtech/scripts/apply_branding.py orca

      - name: Instalar CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.3.0"

      - name: Preparar Visual Studio
        uses: microsoft/setup-msbuild@v2

      - name: Instalar NSIS (para el instalador)
        run: choco install nsis -y

      - name: Compilar el programa
        working-directory: orca
        shell: pwsh
        run: .\build_release_vs.bat slicer

      - name: Armar instalador
        working-directory: orca/build
        run: cpack -G NSIS

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: VisualtechSlicer-instalador-Windows
          path: orca/build/VisualtechSlicer_Windows_Installer_*.exe
          if-no-files-found: error

      - name: Subir versión portable (sin instalar)
        uses: actions/upload-artifact@v4
        with:
          name: VisualtechSlicer-portable-Windows
          path: orca/build/OrcaSlicer
          if-no-files-found: error
